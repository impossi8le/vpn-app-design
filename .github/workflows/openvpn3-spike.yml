# СПАЙК: собирается ли ядро OpenVPN 3 под Android arm64.
#
# Отдельный workflow, а не шаг основного CI, и намеренно так:
#  - основной CI должен оставаться быстрым и зелёным, пока движок не проверен;
#  - спайк отвечает на ОДИН вопрос — «собирается ли», — и его результат нужен
#    один раз, чтобы принять решение, а не на каждый коммит;
#  - если сборка окажется слишком долгой или хрупкой, это надо узнать до того,
#    как она войдёт в основной путь.
#
# Запускается вручную (workflow_dispatch) ИЛИ вместе с основным CI, пока идёт
# проверка. После ответа на вопрос его можно удалить — он не часть продукта.
name: OpenVPN3 spike

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openvpn3-spike.yml'
      # Рецепт сборки живёт здесь, и прогон обязан перезапускаться при его
      # правке. Иначе исправление в CMakeLists не проверяется: триггер следил
      # только за самим workflow, и один фикс остался непроверенным.
      - 'android/vpnengine/**'

jobs:
  build-core:
    # Две архитектуры, и обе нужны по делу: arm64 — для реального телефона,
    # x86_64 — для эмулятора, на котором идёт проверка. Собрав только arm64,
    # движок на эмуляторе не проверить вовсе: APK установится, а библиотека
    # не загрузится, и это выглядело бы как поломка приложения, а не сборки.
    name: Core for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Point at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          # swig нужен для генерации JNI-биндинга — ровно то, что делает CMakeLists
          # ics-openvpn: SWIG_EXECUTABLE -c++ -java -package net.openvpn.ovpn3 \
          #   -DOPENVPN_PLATFORM_ANDROID ... client/ovpncli.i
          #
          # Остальное — по списку из cmake/findcoredeps.cmake: mbedTLS, OpenSSL,
          # lzo, lz4, jsoncpp, fmt, аio. Первый прогон спайка упал именно на том,
          # что asio не находится: `Could NOT find asio (missing: ASIO_INCLUDE_DIR)`.
          # asio в apt нет — он header-only и берётся из git.
          sudo apt-get install -y --no-install-recommends \
            swig cmake ninja-build build-essential \
            libmbedtls-dev liblzo2-dev python3-dev \
            libssl-dev liblz4-dev libjsoncpp-dev libfmt-dev \
            pkg-config git
          swig -version | head -3
          cmake --version | head -1
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "NDK не предустановлен — поставим"

      # Кэш vcpkg обязателен: без него каждая итерация заново компилирует
      # OpenSSL и mbedTLS под arm64 — это минуты на каждом прогоне, а итераций
      # по сборке ядра будет много.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-installed
            ${{ runner.temp }}/vcpkg-cache
          # Ключ НЕ включает хеш всего workflow: файл правится на каждой итерации,
          # и кэш тогда не восстанавливается никогда — каждая сборка заново
          # компилирует OpenSSL под arm64. Ключ привязан к набору зависимостей,
          # который меняется редко.
          key: vcpkg-${{ matrix.abi }}-openssl-lz4-lzo-fmt-jsoncpp-mbedtls-v1
          restore-keys: vcpkg-${{ matrix.abi }}-

      - name: Provide asio and vcpkg
        run: |
          set -euo pipefail
          # asio — header-only, в apt отсутствует, берём из git.
          git clone --depth 1 --branch asio-1-30-2 \
            https://github.com/chriskohlhoff/asio.git "$RUNNER_TEMP/asio"
          echo "ASIO_INCLUDE_DIR=$RUNNER_TEMP/asio/asio/include" >> "$GITHUB_ENV"

          # vcpkg — правильный путь для КРОСС-компиляции. Первые прогоны показали,
          # что apt-библиотеки бесполезны: они собраны под x86_64 хоста, а нужны
          # под arm64 Android (`Could NOT find lz4` при установленном liblz4-dev).
          # У vcpkg есть встроенные триплеты `arm64-android`, и он собирает
          # зависимости из исходников сразу под целевую архитектуру.
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version

          # Двоичный кэш + отдельный каталог установки: переживают прогоны,
          # поэтому OpenSSL пересобирается только при смене этого workflow.
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_DIR=$RUNNER_TEMP/vcpkg-installed" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Install native deps
        run: |
          set -euo pipefail
          # Именно эти шесть названы в cmake/findcoredeps.cmake, и именно их
          # нельзя взять из apt при кросс-компиляции.
          "$VCPKG_ROOT/vcpkg" install \
            --triplet ${{ matrix.triplet }} \
            --overlay-triplets="$VCPKG_ROOT/triplets/community" \
            openssl lz4 lzo fmt jsoncpp mbedtls

      - name: Ensure NDK
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null
          fi
          ndk=$(ls -d "$ANDROID_HOME"/ndk/*/ | head -1)
          echo "NDK_PATH=$ndk" >> "$GITHUB_ENV"
          echo "Используется NDK: $ndk"

      # Ядро кладём рядом с проектом, а не внутрь: это внешний код, ему не место
      # в нашем дереве, пока решение не принято.
      - name: Fetch OpenVPN 3 upstream
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine" && cd "$RUNNER_TEMP/engine"
          # Официальный upstream (MPL 2.0), НЕ форк schwabe: Android-поддержка
          # (OPENVPN_PLATFORM_ANDROID) есть в самом upstream — проверено по коду.
          git clone --depth 1 https://github.com/OpenVPN/openvpn3.git
          cd openvpn3
          echo "HEAD: $(git rev-parse --short HEAD)"
          echo "--- android-специфика в ядре ---"
          grep -rl "OPENVPN_PLATFORM_ANDROID" --include=*.hpp --include=*.cpp . | head -10
          echo "--- есть ли ovpncli.i для SWIG ---"
          ls -la client/ovpncli.i

      # Конфигурация под Android через vcpkg + NDK.
      #
      # Два урока из прогонов, которые надо держать в голове:
      #  1. `VCPKG_CHAINLOAD_TOOLCHAIN_FILE` с NDK-тулчейном ОБЯЗАТЕЛЕН. Без него
      #     `CMAKE_SYSTEM_NAME` остаётся `Linux`, и ядро начинает искать
      #     Linux-утилиты (`libcap`, `libnl-genl`), которых на Android нет:
      #     ровно это и упало в прогоне 37159078551.
      #  2. Тесты выключаются флагом `BUILD_TESTING=OFF` — внутри своей
      #     CMakeLists они делают `if (NOT BUILD_TESTING) return()`. Имя
      #     `ENABLE_TESTING` не подходит: это опция mbedTLS, и она ни на что
      #     здесь не влияет.
      - name: Configure for Android
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/engine/openvpn3"
          ndk_toolchain="$NDK_PATH/build/cmake/android.toolchain.cmake"
          [ -f "$ndk_toolchain" ] || { echo "нет NDK-тулчейна: $ndk_toolchain"; exit 1; }

          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ndk_toolchain" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_ROOT/triplets/community" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DASIO_INCLUDE_DIR="$ASIO_INCLUDE_DIR" \
            -DBUILD_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            2>&1 | tail -40

      - name: Build
        run: |
          set -euo pipefail
          ndk_toolchain="$NDK_PATH/build/cmake/android.toolchain.cmake"

          # Собираем НЕ дерево upstream целиком, а свою библиотечную цель.
          # Причина: у upstream ядро не выделено в библиотеку, а SWIG настроен
          # только на Python. Плюс `test/ovpncli` там собирается безусловно —
          # не гейтится BUILD_TESTING, — и именно он падал, потому что это
          # эталонная CLI-программа, а не библиотека.
          #
          # android/vpnengine/CMakeLists.txt заводит цель `ovpn3`: ядро 3.x плюс
          # Java-биндинг через SWIG с -DOPENVPN_PLATFORM_ANDROID.
          cmake -S "$GITHUB_WORKSPACE/android/vpnengine" -B "$RUNNER_TEMP/enginebuild" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ndk_toolchain" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_ROOT/triplets/community" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVPN3_DIR="$RUNNER_TEMP/engine/openvpn3" \
            -DASIO_INCLUDE_DIR="$ASIO_INCLUDE_DIR" \
            -DBUILD_TESTING=OFF \
            2>&1 | tail -50

          cmake --build "$RUNNER_TEMP/enginebuild" -j"$(nproc)" 2>&1 | tail -60

      - name: Report artefacts
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/enginebuild" 2>/dev/null || exit 0
          echo "=== собранное ==="
          find . -name '*.so' 2>/dev/null | head -20
          echo "=== Java-классы биндинга ==="
          find . -name '*.java' 2>/dev/null | head -20
          echo "=== архитектура библиотеки (должна быть aarch64) ==="
          so=$(find . -name 'ovpn3.so' | head -1)
          if [ -n "$so" ]; then
            readelf="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            [ -x "$readelf" ] && "$readelf" -h "$so" | grep -i machine || true
          fi
          echo "=== сколько Java-классов сгенерировано ==="
          find . -name '*.java' | wc -l
          echo "=== ключевые классы ClientAPI ==="
          find . -name 'OpenVPNClient.java' -o -name 'ClientAPI.java' | head -5

      # Без выгрузки результат спайка виден только в логе, и подключить ядро к
      # :vpnservice нечем: библиотеку надо куда-то положить.
      - name: Upload engine
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ovpn3-engine-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/enginebuild/jniLibs/**/*.so
            ${{ runner.temp }}/enginebuild/java/**/*.java
          retention-days: 30
          if-no-files-found: error
