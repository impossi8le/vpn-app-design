name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Android-минуты на публичном репозитории бесплатны и без лимита (в отличие от macOS).
# Это основной способ проверки кода, пока на рабочей машине нет JDK и Android SDK.
jobs:
  test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Wrapper закоммичен в репозиторий и сам себе версия — отдельный пин Gradle
      # больше не нужен. Он же снимает зависимость от того, что оказалось на раннере.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # `test`, а НЕ `testDebugUnitTest`: последняя задача существует только в
      # Android-модулях, а core:domain / core:config / core:network — чистый Kotlin/JVM
      # и их задача называется `test`. С `testDebugUnitTest` самые важные тесты
      # (домен, инвариант защиты, протокол записи) молча не запускались бы.
      # `test` покрывает оба вида модулей.
      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: test
    # Пока keystore не создан и секреты не заведены, релиз-джоба не может пройти —
    # сходить красным она будет на КАЖДОМ пуше в main и прятать реальные ошибки.
    # Поэтому: нет секрета → джоба пропускается с явным сообщением, а не падает.
    # Как только ANDROID_KEYSTORE_BASE64 появится, джоба включается сама.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && secrets.ANDROID_KEYSTORE_BASE64 != ''
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # versionCode обязан расти, иначе APK не установится поверх предыдущего (§10.3).
      # Используем номер прогона CI как монотонный счётчик.
      #
      # Проверяются ВСЕ четыре секрета, а не только keystore: если keystore задан,
      # а пароль нет, signingConfig получит null и сборка упадёт в фазе подписи
      # с невнятной ошибкой вместо явного «секрет не задан».
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Секрет $name не задан — подписанный релиз невозможен."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
          # Требуем подпись жёстко: без этого assembleRelease молча выпускает
          # app-release-unsigned.apk, а глоб ниже подхватит его как релиз (§10.3).
          REQUIRE_SIGNING: "true"
        run: ./gradlew :app:assembleRelease --no-daemon

      # Неподписанный APK не должен доехать до артефакта: глоб */*.apk его поймает.
      - name: Verify APK is signed
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk)
          case "$apk" in
            *unsigned*) echo "::error::Собран неподписанный APK: $apk"; exit 1 ;;
          esac
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk"

      # APK публикуется как артефакт прогона; бот забирает его через
      # GitHub Release / artifact API (см. §10.3 архитектуры).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-app-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
