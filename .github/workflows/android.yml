name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Android-минуты на публичном репозитории бесплатны и без лимита (в отличие от macOS).
# Это основной способ проверки кода, пока на рабочей машине нет JDK и Android SDK.
jobs:
  # Движок собирается отдельной джобой и кладёт результат в дерево модуля.
  #
  # Почему не внутри сборки APK: сборка тянет NDK, CMake и vcpkg, который компилирует
  # OpenSSL, mbedTLS, lzo, lz4, fmt и jsoncpp ИЗ ИСХОДНИКОВ под каждую архитектуру.
  # Это ~10 минут на холодном кэше. Держать это в сборке каждого APK значит сделать
  # каждую итерацию на десять минут медленнее.
  #
  # Почему обе архитектуры в одной джобе, а не матрицей: результат нужен СРАЗУ
  # вместе — APK с одной архитектурой либо не встанет на телефон, либо не запустится
  # на эмуляторе. Раздельные артефакты пришлось бы склеивать вручную.
  engine:
    name: Build engine (arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Point at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          # swig генерирует JNI-биндинг, остальное — зависимости ядра из
          # cmake/findcoredeps.cmake. asio в apt нет: он header-only, берём из git.
          sudo apt-get install -y --no-install-recommends \
            swig cmake ninja-build build-essential pkg-config git

      - name: Provide asio and vcpkg
        run: |
          set -euo pipefail
          git clone --depth 1 --branch asio-1-30-2 \
            https://github.com/chriskohlhoff/asio.git "$RUNNER_TEMP/asio"
          echo "ASIO_INCLUDE_DIR=$RUNNER_TEMP/asio/asio/include" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_DIR=$RUNNER_TEMP/vcpkg-installed" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Ensure NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -z "$(ls -A "$sdk/ndk" 2>/dev/null)" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
          fi
          ndk=$(ls -d "$sdk"/ndk/*/ | head -1)
          echo "NDK_PATH=$ndk" >> "$GITHUB_ENV"

      # Кэш на каждую архитектуру отдельно: наборы зависимостей разные.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-installed
            ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ndk27-ossl3-lz4-lzo-fmt-jsoncpp-mbedtls-v1
          restore-keys: vcpkg-ndk27-

      - name: Fetch OpenVPN 3 upstream
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine" && cd "$RUNNER_TEMP/engine"
          git clone --depth 1 https://github.com/OpenVPN/openvpn3.git
          cd openvpn3 && echo "HEAD: $(git rev-parse --short HEAD)"

      # Ключевой шаг: результат сразу в дерево модуля, чтобы сборка APK
      # подхватила его без ручной склейки артефактов.
      - name: Build for both ABIs into the module tree
        run: |
          set -euo pipefail
          ndk_toolchain="$NDK_PATH/build/cmake/android.toolchain.cmake"

          for pair in "arm64-v8a:arm64-android" "x86_64:x64-android"; do
            abi="${pair%%:*}"; triplet="${pair##*:}"
            echo "=== $abi ($triplet) ==="

            # --overlay-triplets ОБЯЗАТЕЛЕН: триплеты arm64-android и x64-android
            # лежат в triplets/community, и без overlay vcpkg их не находит —
            # отсюда было «Could NOT find lz4» при формально успешной установке.
            # Вывод НЕ прячем в /dev/null: спрятанный вывод уже стоил отдельной
            # отладочной итерации, потому что причина утонула.
            "$VCPKG_ROOT/vcpkg" install --triplet "$triplet" \
              --overlay-triplets="$VCPKG_ROOT/triplets/community" \
              openssl lz4 lzo fmt jsoncpp mbedtls

            build="$RUNNER_TEMP/build-$abi"
            cmake -S android/vpnengine -B "$build" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ndk_toolchain" \
              -DVCPKG_TARGET_TRIPLET="$triplet" \
              -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPENVPN3_DIR="$RUNNER_TEMP/engine/openvpn3" \
              -DASIO_INCLUDE_DIR="$ASIO_INCLUDE_DIR" \
              -DBUILD_TESTING=OFF
            cmake --build "$build" -j"$(nproc)"

            # Библиотека — в jniLibs, чтобы Gradle упаковала её в APK.
            mkdir -p "android/vpnengine/src/main/jniLibs/$abi"
            find "$build" -name 'ovpn3.so' -exec cp {} "android/vpnengine/src/main/jniLibs/$abi/" \;
            # Java-классы биндинга одинаковы для всех архитектур: копируем один раз.
            if [ ! -d android/vpnengine/src/main/java/net ]; then
              mkdir -p android/vpnengine/src/main/java
              find "$build/java" -name '*.java' -exec cp {} android/vpnengine/src/main/java/ \;
            fi
          done

          echo "=== что получилось ==="
          find android/vpnengine/src/main/jniLibs -name '*.so' -exec ls -la {} \;
          echo "Java-классов: $(find android/vpnengine/src/main/java -name '*.java' | wc -l)"

      # Движок не коммитится: он собирается заново на каждом прогоне. Артефакт
      # нужен, чтобы посмотреть результат и при желании разложить локально.
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: ovpn3-engine
          path: |
            android/vpnengine/src/main/jniLibs/**/*.so
            android/vpnengine/src/main/java/**/*.java
          retention-days: 30
          if-no-files-found: error

  test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    needs: engine
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Движок приходит артефактом от джобы engine и раскладывается в дерево
      # модуля: здесь он уже собран, локально его собирать не нужно.
      - name: Download engine
        uses: actions/download-artifact@v4
        with:
          name: ovpn3-engine
          path: android/vpnengine/src/main

      # android-actions/setup-android НЕ нужен и убран: на ubuntu-latest Android
      # SDK уже предустановлен, а этот action падает на чистом раннере (проверено
      # прогоном 37136421873). Переменные окружения для SDK выставляются вручную
      # из каталога, который GitHub держит на образе.
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      # compileSdk 35 должен быть установлен, и лицензии приняты — иначе AGP
      # останавливается с просьбой принять их вручную, чего на раннере сделать
      # некому. Ставим только отсутствующее, чтобы не тратить минуты впустую.
      - name: Ensure platform 35 and build-tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$sdk/platforms/android-35" ]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
          if ! ls "$sdk"/build-tools/35.* >/dev/null 2>&1; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # Wrapper закоммичен в репозиторий и сам себе версия — отдельный пин Gradle
      # больше не нужен. Он же снимает зависимость от того, что оказалось на раннере.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # `test`, а НЕ `testDebugUnitTest`: последняя задача существует только в
      # Android-модулях, а core:domain / core:config / core:network — чистый Kotlin/JVM
      # и их задача называется `test`. С `testDebugUnitTest` самые важные тесты
      # (домен, инвариант защиты, протокол записи) молча не запускались бы.
      # `test` покрывает оба вида модулей.
      # Вывод Gradle заворачивается в аннотацию: скачать лог джобы может только
      # администратор репозитория, а аннотации доступны через check-runs API
      # любому, у кого есть доступ на чтение. Без этого отладка вслепую.
      - name: Unit tests
        run: |
          set +e
          ./gradlew test --no-daemon 2>&1 | tee gradle-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Отбрасываем строки о задачах ("> Task ..."), иначе они вытесняют
            # настоящую ошибку из-под лимита аннотации.
            grep -vE '^> Task ' gradle-test.log \
              | grep -E 'e: |error:|FAILED|Execution failed|Could not|Caused by|Caused|expected|Unresolved|What went wrong|symbol|internal' \
              | head -25 > err.txt
            if [ ! -s err.txt ]; then
              grep -vE '^> Task ' gradle-test.log | tail -25 > err.txt
            fi
            msg=$(sed 's/"/\x27/g' err.txt | tr '\n' '|' | cut -c1-4000)
            echo "::error title=Gradle test failed::$msg"
          fi
          exit "$status"

      # Имя упавшего теста без текста утверждения отладке не помогает: неясно,
      # что именно вернул код. Аннотация несёт только первую строку, поэтому
      # сообщения собираются из XML-отчётов в отдельную аннотацию.
      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY' > failures.txt || true
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('**/TEST-*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      message = (fail.get('message') or '').strip()
                      body = [l for l in (fail.text or '').strip().splitlines() if l.strip()][:4]
                      print(f"--- {name}\n{message}")
                      for line in body:
                          print(f"    {line}")
          PY
          if [ -s failures.txt ]; then
            echo "::error title=Test failures::$(sed 's/"/\x27/g' failures.txt | tr '\n' '|' | cut -c1-4000)"
          fi

      # Зелёная сборка без единого выполненного теста — худший отказ этого проекта:
      # инвариант защиты и протокол записи считались бы проверенными, не будучи
      # запущенными ни разу. JUnit5 при отсутствии движка/лаунчера именно так и
      # ведёт себя — молча. Поэтому число выполненных тестов проверяется явно.
      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          total=$(find . -path '*/test-results/*' -name 'TEST-*.xml' -exec \
            grep -ho 'tests="[0-9]*"' {} + 2>/dev/null \
            | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          echo "Выполнено тестов: ${total:-0}"
          # Счёт виден и на успехе: «зелено» без числа неотличимо от «зелено,
          # потому что тестов не нашлось».
          echo "::notice title=Выполнено тестов::${total:-0}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::Ни один тест не выполнился. Сборка зелёная, но ничего не проверено."
            exit 1
          fi

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      # Debug-APK публикуется артефактом: это то, что можно поставить на телефон
      # прямо сейчас, без keystore и секретов подписи. Подписан debug-ключом —
      # для сайдлоада этого достаточно, а для раздачи пользователям нужен
      # release (см. джобу release).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-app-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  # Отдельная джоба, а не продолжение `test`: инструментальные тесты идут под
  # AndroidJUnitRunner (JUnit4) и требуют эмулятора. Держать их в `test` нельзя —
  # тогда падение эмулятора выглядит как падение юнит-тестов.
  instrumented:
    name: Instrumented (emulator)
    runs-on: ubuntu-latest
    needs: [engine, test]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Движок приходит артефактом: в этих джобах он нужен для APK.
      - name: Download engine
        uses: actions/download-artifact@v4
        with:
          name: ovpn3-engine
          path: android/vpnengine/src/main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # KVM обязателен: без него эмулятор запускается программно и не успевает
      # подняться за отведённое время, давая ложное «тесты не прошли».
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        id: instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          working-directory: android
          # ВАЖНО, и это уже стоило ложной зелени: падение компиляции
          # инструментальных тестов однажды отчиталось успехом, потому что вывод
          # шёл через `| tee`, а код возврата конвейера — это код tee, не Gradle.
          #
          # Никакого конвейера: пишем в файл и возвращаем именно код Gradle.
          # ${PIPESTATUS} и `set -o pipefail` здесь не годятся — скрипт выполняет
          # `sh`, а не bash, и там их нет.
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --console=plain > instrumented.log 2>&1
            status=$?
            cat instrumented.log
            exit $status

      # Аннотация с причиной падения: логи джобы требуют прав администратора,
      # а без разбора причина «instrumented tests failed» ничего не объясняет.
      - name: Report instrumented failures
        if: failure()
        run: |
          # Лог пишется относительно рабочего каталога джобы (android/),
          # поэтому никаких переходов: файл рядом.
          if [ -f instrumented.log ]; then
            grep -vE '^> Task |^Download|^Starting|^Welcome|^$' instrumented.log \
              | grep -iE 'error|fail|exception|unable|no devices|adb|instrumentation|runner|assert|Caused' \
              | head -25 > inst.txt || true
            if [ -s inst.txt ]; then
              echo "::error title=Instrumented tests failed::$(sed 's/"/\x27/g' inst.txt | tr '\n' '|' | cut -c1-4000)"
            else
              tail -30 instrumented.log > tail.txt
              echo "::error title=Instrumented tests failed (tail)::$(sed 's/"/\x27/g' tail.txt | tr '\n' '|' | cut -c1-4000)"
            fi
          else
            echo "::error title=Instrumented tests failed::лог не создан — эмулятор не запустился или сломался раньше тестов"
          fi

  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: test
    # ВАЖНО: `secrets` НЕДОСТУПЕН в job-level `if` — GitHub отвергает такой
    # workflow целиком (прогон создаётся, но с нулём джобов). Поэтому проверка
    # наличия секретов вынесена в первый шаг, а остальные шаги гейтятся его
    # результатом. Нет keystore → джоба проходит шумно, но не краснеет.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # working-directory задаётся ПОШАГОВО, а не через defaults: первый шаг
    # выполняется до checkout, и каталога android ещё не существует — джоба
    # падает на запуске bash с «No such file or directory».
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 не задан — подписанный релиз пропущен."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.signing.outputs.ok == 'true'
        uses: actions/checkout@v4

      # Движок нужен и релизу: без него APK соберётся, но при запуске упадёт
      # на System.loadLibrary, а это хуже отказа — пользователь увидит закрытие
      # приложения вместо честного сообщения.
      - if: steps.signing.outputs.ok == 'true'
        name: Download engine
        uses: actions/download-artifact@v4
        with:
          name: ovpn3-engine
          path: android/vpnengine/src/main

      - if: steps.signing.outputs.ok == 'true'
        name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.signing.outputs.ok == 'true'
        name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - if: steps.signing.outputs.ok == 'true'
        name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # versionCode обязан расти, иначе APK не установится поверх предыдущего (§10.3).
      # run_number монотонен в пределах workflow; для релиза нужен ещё и монотонный
      # рост относительно уже опубликованного APK — см. §14.
      # Проверяются ВСЕ четыре секрета: keystore без пароля даёт null storePassword
      # и невнятное падение в фазе подписи вместо явного «секрет не задан».
      - if: steps.signing.outputs.ok == 'true'
        name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Секрет $name не задан — подписанный релиз невозможен."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - if: steps.signing.outputs.ok == 'true'
        name: Build signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
          # Требуем подпись жёстко: без этого assembleRelease молча выпускает
          # app-release-unsigned.apk, а глоб ниже подхватил бы его как релиз (§10.3).
          REQUIRE_SIGNING: "true"
        run: ./gradlew :app:assembleRelease --no-daemon

      # Неподписанный APK не должен доехать до артефакта: глоб */*.apk его поймает.
      - if: steps.signing.outputs.ok == 'true'
        name: Verify APK is signed
        working-directory: android
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk)
          case "$apk" in
            *unsigned*) echo "::error::Собран неподписанный APK: $apk"; exit 1 ;;
          esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      # APK публикуется как артефакт прогона; бот забирает его через
      # GitHub Release / artifact API (см. §10.3 архитектуры).
      - if: steps.signing.outputs.ok == 'true'
        name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-app-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
